# Tự chạy test mỗi lần push / tạo pull request. Xem kết quả ở tab "Actions" trên GitHub.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      # Không cần MongoDB hay API key: test dùng DB giả và tắt Gemini/Safe Browsing thật.
      - run: pytest -q

  extension:
    name: Extension (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    env:
      PUPPETEER_SKIP_DOWNLOAD: "true" # test trình duyệt (npm run e2e / web-test) chạy ở máy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
